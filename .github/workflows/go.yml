name: go
on:
  push:
    tags:
      - v*
    branches:
      - master
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
    - name: Test
      run: go test -v ./...
    - name: GoReleaser
      uses: goreleaser/goreleaser-action@v7
      if: startsWith(github.ref, 'refs/tags/')
      with:
        version: '~> v2'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
    - name: E2E tests
      run: go test -tags e2e -v -timeout 600s ./e2e/...
